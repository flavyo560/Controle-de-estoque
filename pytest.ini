[pytest]
# Diretórios de testes
testpaths = tests

# Padrões de descoberta de testes
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers personalizados
markers =
    unit: Testes unitários que verificam exemplos específicos e casos extremos
    property: Testes baseados em propriedades que verificam propriedades universais
    integration: Testes de integração que verificam fluxos completos do sistema
    slow: Testes que demoram mais de 1 segundo para executar

# Opções de execução
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Configuração de cobertura
[coverage:run]
source = .
omit = 
    tests/*
    venv/*
    .venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
